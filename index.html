<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beat the Sphinx | A daily riddle challenge</title>
  <meta name="description" content="Answer three riddles from the Sphinx. Get two right or be eaten.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%81%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stars" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>
  <div class="pyramid left" aria-hidden="true"></div>
  <div class="pyramid right" aria-hidden="true"></div>

  <main>
    <header>
      <h1>Beat the Sphinx</h1>
      <p id="puzzle-no"></p>
      <button type="button" id="mute" class="small" aria-pressed="false">Sound: on</button>
    </header>

    <canvas id="sphinx" class="sprite sphinx" width="16" height="16" role="img" aria-label="The Sphinx"></canvas>

    <section id="riddle-view" hidden>
      <div class="progress" id="progress" aria-label="Progress"></div>
      <p class="tier" id="tier"></p>
      <p class="box riddle" id="riddle"></p>
      <form id="answer-form" autocomplete="off">
        <label for="answer" class="sr-only">Your answer</label>
        <input id="answer" type="text" placeholder="Your answer" required>
        <button type="submit">Answer</button>
      </form>
      <div id="feedback" role="status" hidden>
        <p id="feedback-text"></p>
        <button type="button" id="next-btn">Next riddle</button>
      </div>
    </section>

    <section id="result-view" hidden>
      <h2 id="verdict"></h2>
      <p id="verdict-sub"></p>
      <div class="progress" id="result-progress"></div>
      <button type="button" id="share-btn">Copy result</button>
      <dl class="stats" id="stats"></dl>
      <p class="note">New riddles at midnight.</p>
    </section>
  </main>
  <script src="riddles.js"></script>
  <script src="sprites.js"></script>
  <script src="sound.js"></script>
  <script src="script.js"></script>
</body>
</html>
